<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ url_for('feed') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}">{{ site.title }}</a>
    <nav>
      <a href="{{ url_for('posts') }}">Writing</a>
      <a href="{{ url_for('projects') }}">Projects</a>
      <a href="{{ url_for('about') }}">About</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span>&copy; {{ year }} {{ site.author }}</span>
    <a href="{{ url_for('feed') }}">RSS</a>
  </footer>
</body>
</html>
